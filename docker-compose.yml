# Development services (ports bound to 127.0.0.1 only), started by `bun run dev` (`bun run services:up`). Host ports come
# from .env and default to the values below, which differ from operix-api's so both stacks can
# run together. Nothing here is a deployment.
#
# MongoDB: a one-node replica set (transactions need one) at
# mongodb://localhost:27018/?replicaSet=rs0&directConnection=true.
# Redis: redis://localhost:6380 (rate limits, queues, pub/sub).
# Mailpit: SMTP smtp://localhost:1026, messages at http://localhost:8026.
# MinIO: S3 API http://localhost:9002, console http://localhost:9003, pulsarix-dev / pulsarix-dev-secret.
name: pulsarix-api
services:
  mongo:
    image: mongo:8
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo-data:/data/db
    # A TCP probe from bash (no mongosh per check); mongo-init initiates the set.
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/27017"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # One-shot (`docker compose run --rm mongo-init`, run by `services:up`): initiates the
  # one-node replica set and waits for its primary. Drivers on the host connect with
  # directConnection=true, so the member's name stays `localhost:27017`.
  mongo-init:
    image: mongo:8
    profiles: [init]
    depends_on:
      mongo:
        condition: service_healthy
    command:
      - mongosh
      - --host
      - mongo
      - --quiet
      - --eval
      - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }; for (let i = 0; i < 60 && !db.hello().isWritablePrimary; i++) sleep(1000); quit(db.hello().isWritablePrimary ? 0 : 1)"
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

  redis:
    image: redis:7.4
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
      start_interval: 2s

  mailpit:
    image: axllent/mailpit:v1.34
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1026}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8026}:8025"

  # Chainguard's builds of the MinIO server and client (Docker Hub and quay.io no longer
  # publish MinIO), pinned by digest, as operix-api does.
  minio:
    image: cgr.dev/chainguard/minio@sha256:268d68a2a3b6fc65f905a61f84d7eab6345ce6bff14f551e2b028ec31e6a1341
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: pulsarix-dev
      MINIO_ROOT_PASSWORD: pulsarix-dev-secret
    ports:
      - "127.0.0.1:${S3_PORT:-9002}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio-data:/data

  # One-shot: creates the private bucket and exits.
  media-bucket:
    image: cgr.dev/chainguard/minio-client@sha256:59f1924e417b6fcfdc0aca321e3bdebe8a56fd0efa7da80037d5eb65a203d687
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://pulsarix-dev:pulsarix-dev-secret@minio:9000
    command: ["mb", "--ignore-existing", "local/pulsarix-media"]
    restart: on-failure

volumes:
  mongo-data:
  minio-data:
