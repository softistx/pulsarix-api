  rotateWidgetKey(id: ID!): WidgetKey!
  """
  Turns the second-factor requirement of the request's organisation on or off.
  Needs `organisation:manage` (admin, owner) and a recent proof of identity (403
  `auth.errors.step-up-required`). Turning it on needs the viewer's own second
  factor to be active (409 `auth.errors.second-factor-not-enrolled`), so the
  admin does not lock themselves out.
