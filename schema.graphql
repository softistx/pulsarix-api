  `invalid` issue on `email` for an address that is taken or malformed, a
  `too-short` issue on `password`). Making an organisation comes next
  (`createOrganisation`).
  """
  signUp(input: SignUpInput!): SignInPayload!
  """
  Starts the viewer's timer on the issue (chronix stops and saves the one
  running). Needs `time:write`. 403 `time.errors.email-unverified` (the
  account's e-mail is not verified); 409 `time.errors.not-linked`; 422
  `time.errors.project-not-mapped`; 403 `time.errors.forbidden`; 400
  `time.errors.invalid-key` (chronix refused the stored key); 429
  `time.errors.rate-limited`; 404 `issues.errors.not-found` (`issueId` unknown);
  503 `time.errors.unavailable`.
