"""
A person who works in the request's organisation: an account with one role there.
"""
type Member {
  """False for a deactivated account, which can no longer sign in."""
  active: Boolean!
  conflict: Boolean!
  email: EmailAddress!
  """The account's id."""
  id: ID!
  """Whether this member is the signed-in account."""
  isViewer: Boolean!
  name: String!
  """
  Null when the account holds several roles in the organisation (`conflict`,
  data written outside the API): it has no access until `changeMemberRole`
  gives it one, or `removeMember` takes it out.
  """
  role: Role
}

type Mutation {
  """
  Accepts a new report: an issue is made from it in the project's Triage
  status, linked both ways, and its files are released to the issue. Needs `issue:write`. 409
  `intake.errors.report-decided`; 404 `intake.errors.not-found`.
  """
  acceptClientReport(id: ID!): ClientReport!
  """
  Accepts an invitation with the token of its link (`/invitations/accept`):
  makes or finds the account of the invitation's e-mail, gives it the
  invitation's role in the organisation, and signs it in (`signIn`), or answers
  `linked` for an account that already signs in with a password (sign in as
  usual). A new account, and an account whose e-mail was never proved, needs
  `password`. Anonymous. 400 `invitations.errors.invalid` for a token unknown,
  spent, revoked or expired; 400 `validation.errors.invalid-input` (a
  `required` issue on `password`); 409 `invitations.errors.already-member`.
  """
  acceptInvitation(password: String @constraint(maxLength: 1024), token: String! @constraint(maxLength: 200)): AcceptInvitationPayload!
  """
  Activates the factor with the first code the app shows, and answers the
  recovery codes, once. 400 `auth.errors.invalid-code`; 409
  `auth.errors.second-factor-not-enrolled` or `auth.errors.second-factor-active`.
  """
  activateSecondFactor(code: String! @constraint(maxLength: 20)): RecoveryCodes!
  """
  Comments on an issue as the viewer. Needs `comment:write`. 404
  `issues.errors.not-found`; 400 `comments.errors.mention-not-member` (on
  `body`) when a mention marker names someone who is no member of the
  organisation.
  """
  addComment(input: AddCommentInput!, issueId: ID!): Comment!
  """
  Hides the project from the default list; nothing is deleted. Needs `project:manage`.
  """
  archiveProject(id: ID!): Project!
  """
  Gives a member another role. Needs `member:manage` (admin, owner) and a
  recent proof of identity (403 `auth.errors.step-up-required`: `requestStepUp`
  then `confirmStepUp`). Only an owner grants the owner role or changes an
  owner's (403 `members.errors.owner-required`). An organisation never loses its
  last active owner (409 `members.errors.last-owner`). 404
  `members.errors.not-found` for an account that is no member.
  """
  changeMemberRole(id: ID!, role: Role!): Member!
  """
  Changes the signed-in account's password, given the current one; every other
  session of the account is signed out, the request's own stays. 401
  `auth.errors.unauthenticated`; 400 `validation.errors.invalid-input` (an
  `invalid` issue on `currentPassword`, a `too-short` issue on `newPassword`).
  """
  changePassword(input: ChangePasswordInput!): Boolean!
  """
  Proves the signed-in account's e-mail from a verification link's token,
  posted by the page it opens (never on GET: mail scanners follow links), and
  answers the account. The link is bound to the account that is signed in: a
  token issued to another account is refused and stays usable by its owner. 401
  `auth.errors.unauthenticated`; 400 `auth.errors.invalid-token` for a token
  unknown, expired, spent, issued to another account or to an address the
  account no longer holds. The second factor and the password are kept.
  """
  confirmEmailVerification(token: String! @constraint(maxLength: 200)): Viewer!
  """
