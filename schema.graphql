  startSprint(id: ID!, input: StartSprintInput!): Sprint!
  """
  Stops the viewer's running timer when it runs on this issue and returns the
  entry chronix saved; null when none runs or it runs on another issue (it
  keeps running: a stale tab never stops another issue's timer). Two chronix
  calls, so a timer changed in between is accepted. `issueId` must exist. Needs `time:write`. Same errors as
  `startIssueTimer` (403 `time.errors.email-unverified`, 409
  `time.errors.not-linked`, 403 `time.errors.forbidden`, 400
  `time.errors.invalid-key`, 429 `time.errors.rate-limited`, 404
  `issues.errors.not-found`, 503 `time.errors.unavailable`).
  """
  stopIssueTimer(issueId: ID!): LoggedTime
  """Brings an archived project back. Needs `project:manage`."""
  unarchiveProject(id: ID!): Project!
  """
  Forgets the key. Entries and references stay in chronix. Needs `time:manage` and a fresh session.
  """
  unlinkChronix: TimeLink!
  """
  Removes the link between a report and an issue. The report keeps at least
  one: 409 `intake.errors.last-link` for the last. Needs `issue:write`. 404
  `intake.errors.not-found` (report, or an issue it is not linked to).
  """
  unlinkClientReport(id: ID!, issueId: ID!): ClientReport!
  """Removes the viewer from the watchers; repeatable. Needs `issue:write`."""
  unwatchIssue(id: ID!): Issue!
  """
  Changes the given fields. Needs `issue:write`. 404 `issues.errors.not-found`;
  409 `issues.errors.parent-cycle`; 409 `issues.errors.parent-not-allowed`,
  `parent-type-invalid` or `parent-required` (the type and parent it would
  leave the issue with); 409 `issues.errors.type-breaks-children`.
