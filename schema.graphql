input SignUpInput {
  email: String! @constraint(maxLength: 320)
  name: String! @constraint(minLength: 1, maxLength: 200)
  password: String! @constraint(maxLength: 1024)
}

"""
The direction of a list's `orderBy`. Every sorted list also orders by `id` after
its `orderBy`, so a cursor page across a sort neither skips nor repeats a row.
"""
enum SortDirection {
  ASC
  DESC
  asc
  desc
}

"""
A time-boxed iteration of a project. Sprints exist while the project has
`sprintsEnabled`. Dates are instants; the UI shows them as calendar days.
"""
type Sprint {
  """Set when the sprint is closed."""
  closedAt: DateTime
  """The points of the sprint's issues when it started; 0 until then."""
  committedPoints: Int!
  """The points of the issues done when it closed; 0 until then."""
  completedPoints: Int!
  endDate: DateTime
  goal: String
  id: ID!
  name: String!
  """1, 2, 3... in the order the project's sprints were made."""
  number: Int!
  projectId: ID!
  startDate: DateTime
  state: SprintState!
}

enum SprintState {
  """Running; one per project."""
  active
  """Finished: it keeps its done issues and takes no change."""
  closed
  """Collects issues; any number may exist."""
  planned
}

input StartSprintInput {
  """Defaults to `startDate` plus the project's `sprintLengthWeeks`."""
  endDate: DateTime
  goal: String @constraint(maxLength: 1000)
  """Defaults to the sprint's own name."""
  name: String @constraint(minLength: 1, maxLength: 100)
  startDate: DateTime!
}

"""A step of a project's workflow."""
type Status {
  category: StatusCategory!
  """`#rrggbb`."""
  colour: String!
  id: ID!
  name: String!
  """Its place in the workflow, from 0, with no gap."""
  order: Int!
  projectId: ID!
  """
  What the reporter sees for it; its category's default (triage, backlog, todo: received; inProgress: inProgress; done: resolved; cancelled: declined) until set.
  """
  publicState: PublicState!
}

"""
Where a status stands in the life of an issue. `triage` holds what intake
brings in before a member accepts it.
"""
enum StatusCategory {
  backlog
  cancelled
  done
  inProgress
  todo
  triage
}

"""
A confirmation to give back: with `via` APP the code is the one the
authenticator app shows, with EMAIL it was mailed to the account.
"""
type StepUpChallenge {
  challenge: String!
  expiresAt: DateTime!
  via: StepUpVia!
}

enum StepUpVia {
  APP
  EMAIL
}

"""
Live events over server-sent events (`Accept: text/event-stream`). Each opens
only for a viewer who may read what it names, in the organisation of
`x-organization-id`, and is checked again every 30 seconds: a viewer who lost
the right is cut off. A stream ends after 15 minutes without an event or after
an hour; the client reconnects and refetches.
"""
type Subscription {
  """
  A file of a client report of a project was stored. Needs `issue:write`; 404 `projects.errors.not-found`.
  """
  clientReportFileReceived(projectId: ID!): ClientReportFileEvent!
  """
  A reporter wrote in the thread of a client report of a project. Needs `issue:write`; 404 `projects.errors.not-found`.
  """
  clientReportMessageReceived(projectId: ID!): ClientReportMessageEvent!
  """
  New client reports of a project. Needs `issue:write`; 404 `projects.errors.not-found`.
  """
  clientReportReceived(projectId: ID!): ClientReportEvent!
  """
  Field changes and comments of one issue. Needs `issue:read`; 404 `issues.errors.not-found`.
  """
  issueChanged(issueId: ID!): IssueEvent!
  """The viewer's own notifications. Needs organisation membership."""
  notificationReceived: NotificationEvent!
  """
  Issues of a project created, updated, moved or deleted. Needs `issue:read`; 404 `projects.errors.not-found`.
  """
  projectBoard(projectId: ID!): IssueEvent!
  """
  Every change on the client requests of the organisation, whatever the project: a new request, a message, a state change. Needs `issue:write`.
  """
  requestsChanged: RequestsEvent!
}

"""A time of day with its offset, such as 10:15:30Z (RFC 3339 full-time)."""
scalar Time @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc3339#section-5.6")

"""
Whether the organisation tracks time through chronix. The link key is never
returned: only whether it is linked and the chronix organisation's name.
"""
type TimeLink {
  linked: Boolean!
  """The chronix organisation, null when not linked."""
  organisationName: String
}

"""
The time spent on an issue, read from chronix. Every number is null unless
`status` is AVAILABLE; a chronix outage is `UNAVAILABLE`, never an error.
"""
type TimeSpent {
  entryCount: Int
  """
  The viewer's own running timer, when it runs on this issue. Null when none
  does, when the viewer may not write time (`time:write`), when the organisation
  is not linked, or when chronix does not answer.
  """
  myRunningTimer: IssueTimer
  """Seconds, the viewer's own share."""
  mySeconds: Int
  """Whether someone's timer runs on the issue now."""
  running: Boolean
  status: TimeStatus!
  """Seconds, all members."""
  totalSeconds: Int
}

enum TimeStatus {
  """`totalSeconds` and the rest are set."""
  AVAILABLE
  """
  The viewer may not read time (`time:read`), has no verified e-mail, or is not a member of the chronix organisation.
  """
  FORBIDDEN
  """
  chronix did not answer (or refused the key): the issue works, its time is not shown.
  """
  UNAVAILABLE
  """The organisation has no chronix link."""
  UNLINKED
}

"""An IANA time zone name, such as Europe/Paris."""
scalar TimeZone @specifiedBy(url: "https://www.iana.org/time-zones")

"""
An instant, as an integer number of milliseconds since 1970-01-01T00:00:00Z.
"""
scalar Timestamp

"""A ULID: 26 characters of Crockford base32."""
scalar ULID @specifiedBy(url: "https://github.com/ulid/spec")

"""An absolute http or https URL."""
scalar URL @specifiedBy(url: "https://url.spec.whatwg.org/")

"""A UUID in its 8-4-4-4-12 hexadecimal form."""
scalar UUID @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc9562")

"""A version 4 (random) UUID."""
scalar UUIDv4 @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc9562")

"""A version 7 (time-ordered) UUID."""
scalar UUIDv7 @specifiedBy(url: "https://www.rfc-editor.org/rfc/rfc9562")

enum UnfinishedIssues {
  """Send the unfinished issues back to the backlog."""
  BACKLOG
  """
  Move the unfinished issues to the next planned sprint (made when none exists).
  """
  NEXT_SPRINT
}

"""
A field left out stays as it is. Null clears `assigneeId`, `parentId`,
`startDate`, `dueDate`, `estimateHours` and `points`, and is refused for the others. The status changes
with `moveIssue`. A new `type` or `parentId` is checked against the rules of
`IssueType` (and a new type against the issue's children); a link that already
broke them is left alone until it is edited.
"""
input UpdateIssueInput {
  assigneeId: ID
  description: String @constraint(maxLength: 50000)
  dueDate: DateTime
  """Hours, 0 to 100 000; null clears it."""
  estimateHours: Float
  labelIds: [ID!]
  parentId: ID
  """
  As on `CreateIssueInput`; null clears it. Moving the issue to an Epic or a Sub-task type clears its points.
  """
  points: Int
  priority: IssuePriority
  startDate: DateTime
  title: String @constraint(minLength: 1, maxLength: 200)
  type: IssueType
}

"""A field left out stays as it is; null is refused."""
input UpdateLabelInput {
  colour: String @constraint(maxLength: 7)
  name: String @constraint(minLength: 1, maxLength: 100)
}

"""
A field left out stays as it is; null is refused (400 `validation.errors.required`).
"""
input UpdateOrganisationInput {
  name: String @constraint(minLength: 1, maxLength: 200)
  timeZone: String @constraint(maxLength: 64)
}

"""
A field left out stays as it is; null is refused for `name`, and clears `leadId`.
"""
input UpdateProjectInput {
  description: String @constraint(maxLength: 10000)
  leadId: ID
  name: String @constraint(minLength: 1, maxLength: 200)
  """1 to 4; the length a new sprint defaults to. Null is refused."""
  sprintLengthWeeks: Int @constraint(min: 1, max: 4)
  """
  Turning sprints off while one is active is refused (409 `sprints.errors.active-sprint`); null is refused.
  """
  sprintsEnabled: Boolean
}

"""
A field left out is unchanged; `name` cannot be cleared, `goal` and the dates can.
"""
input UpdateSprintInput {
  endDate: DateTime
  goal: String @constraint(maxLength: 1000)
  name: String @constraint(minLength: 1, maxLength: 100)
  startDate: DateTime
}

"""A field left out stays as it is; null is refused."""
input UpdateStatusInput {
  category: StatusCategory
  colour: String @constraint(maxLength: 7)
  name: String @constraint(minLength: 1, maxLength: 100)
  """
  When only the category changes and the status still wears the old category's default, it follows the new category's.
  """
  publicState: PublicState
}

input UpdateViewerInput {
  """The account's preferred language. Left out keeps it; null is refused."""
  language: Language
  """
  Null is refused (400 `validation.errors.required`): the name cannot be cleared.
  """
  name: String @constraint(minLength: 1, maxLength: 200)
}

"""A field left out stays as it is; null is refused."""
input UpdateWidgetKeyInput {
  active: Boolean
  allowedOrigins: [String!] @constraint(minItems: 1, maxItems: 20, maxLength: 200)
  attachmentsEnabled: Boolean
  label: String @constraint(minLength: 1, maxLength: 100)
}

"""A UTC offset from -12:00 to +14:00, such as +05:30."""
scalar UtcOffset

"""The signed-in account."""
type Viewer {
  email: EmailAddress!
  """
  Whether the account's e-mail is proved (a verification link, a sign-in link, a
  password reset or an invitation proves it). While false, `requestEmailVerification`
  sends the link.
  """
  emailVerified: Boolean!
  """
  Whether a TOTP second factor is active: a sign-in then asks for a code.
  """
  hasSecondFactor: Boolean!
  id: ID!
  """The account's preferred language, or null when it never chose."""
  language: Language
  name: String!
  """
  What the account may do whatever organisations it belongs to:
  `organisation:create`. The permissions in an organisation are
  `Organisation.viewerPermissions`.
  """
  permissions: [String!]!
  """
  When the request's session ends: the BFF sets its cookie's expiry to it.
  """
  sessionExpiresAt: DateTime
}

"""No value: always null."""
scalar Void

"""
A freshly generated identity secret, the only time it is shown. The host signs
its identity tokens with it on its own server, never in a browser.
"""
type WidgetIdentitySecret {
  key: WidgetKey!
  secret: String!
}

"""
A key the widget of a project is embedded with. The key is public by design: it
reads its own configuration and sends reports for its project, nothing else.
"""
type WidgetKey {
  """Off, the widget answers `enabled: false` and takes no report."""
  active: Boolean!
  """
  The sites (`https://host[:port]`) allowed to use it; the public endpoint answers CORS for these only.
  """
  allowedOrigins: [String!]!
  """
  On by default. Off, the widget hides its screenshot and file controls and the key takes no file.
  """
  attachmentsEnabled: Boolean!
  createdAt: DateTime!
  id: ID!
  """
  When the identity secret was last generated; null if the key has none (reports then cannot be identified). The secret itself is never readable.
  """
  identitySecretSetAt: DateTime
  label: String!
  """When it was last used, to the minute; null if never."""
  lastUsedAt: DateTime
  projectId: ID!
  """`pk_live_` and 32 characters: the value of `data-project-key`."""
  publicKey: String!
  """File refusals through this key, by reason, the most frequent first."""
  refusals: [WidgetKeyRefusal!]!
  updatedAt: DateTime!
  """
  Files stored through this key (the quarantined or released ones the widget sent), ever.
  """
  uploads: Int!
}

"""
How many times the key's file traffic was refused for one reason. `reason` is
the slug of an `intake.errors.` code: `attachments-disabled`, `too-many-files`,
`files-too-large`, `file-unsupported-type`, `file-undecodable`, `file-too-large`,
`file-too-many-pixels`, `quarantine-full`, `ticket-invalid`, `ticket-expired`,
`ticket-used`, `upload-mismatch`, `too-many-requests`.
"""
type WidgetKeyRefusal {
  count: Int!
  reason: String!
}

"""An xid: 20 characters of lowercase base32hex."""
scalar XID @specifiedBy(url: "https://github.com/rs/xid")
