  """
  A sprint of the project was made. The row has no issue (`issueId` null).
  """
  sprintCreated
  """
  A sprint of the project was deleted. The row has no issue (`issueId` null).
  """
  sprintDeleted
  """
  A sprint of the project was started. The row has no issue (`issueId` null).
  """
  sprintStarted
  """
  A sprint of the project was edited. The row has no issue (`issueId` null).
  """
  sprintUpdated
  updated
}

