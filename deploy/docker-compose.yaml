# ── pulsarix-api, staging ─────────────────────────────────────────────────────
#
# Modelled on operix-api/deploy. One stack: mongo (a one-node replica set, auth
# on), redis, minio, their init one-shots, the backup service and the API. The
# UI (pulsarix-ui) is an optional service of the `ui` profile, started with `--ui`
# (its Dockerfile is in that repository). The backup service is the `backup` profile. Run it with
# `bun deploy/deploy.ts` (see docs/deployment.md); by hand, from this folder:
#
#   cp .env.example .env     # fill every CHANGE_ME, chmod 600
#   docker compose build && docker compose up -d
#
# Images are built on the host from checkouts, there is no registry: the API
# from `..` (this repository), the UI from UI_CONTEXT (../../pulsarix-ui).
#
# - No `ports:` anywhere. Two networks: `internal`, private to this stack, holds
#   every service; `proxy`, the external network nxgt-docker creates, holds only
#   `api` and `ui` besides, so Traefik reaches them and nothing else. mongo,
#   redis, minio and backup are not on `proxy`: another stack on `proxy` cannot
#   resolve or reach them. `internal` is an ordinary bridge, not `internal: true`:
#   backup needs egress (offsite S3, mail) and so does the API (mail). The
#   isolation is between stacks: a compromised `api` still reaches its own data
#   services. Behind the parc's
#   Cloudflare Tunnel (visitor, Cloudflare, cloudflared, Traefik, app) the
#   hostname is covered by the proxied `*.softistx.com` wildcard: this file adds
#   Traefik router labels and never a DNS record.
# - One public hostname, UI_HOSTNAME. The API's router takes `/public/` on it
#   (the widget's intake endpoint); the rest of the host is the UI's (profile
#   `ui`). The authenticated /graphql has no router: the UI's server reaches it
#   by container name. MinIO has no router either: the API streams attachments.
# - TRUSTED_PROXIES=172.16.0.0/12 (the docker range) makes the API read the
#   client address from X-Forwarded-For past Traefik only: the intake rate
#   limits, the anti-abuse checks and the auth audit depend on it. The API
#   publishes no port, but it is on `proxy`: any other container on that network
#   can reach it directly and send a forged header. That is accepted while the
#   parc's `proxy` network holds only trusted stacks; Traefik is the only
#   intended client.
# - Redis is required: the intake endpoint answers 503 without it, and the
#   rate limits, the digest queue and the live events live in it.
# - STACK_PREFIX is the DOCKER namespace (project name, container names, image
#   tags, router names); the `${X:+${X}-}` form leaves every name unchanged when
#   it is empty. UI_HOSTNAME is the DNS namespace.
# - Secrets are `${X:?}`: compose refuses to start with one missing.
# - Two Mongo credentials. Pulsarix has one database per organisation
#   (pulsarix_org_<id>, created at runtime), so a role scoped to one database
#   cannot work: `mongo-init` creates the app user (readWriteAnyDatabase plus
#   dbAdminAnyDatabase: the API creates each new organisation database's
#   validators and indexes on first use, MONGO_AUTO_SYNC=true) and the backup
#   user (the `backup` role, what the nightly `mongodump --oplog` of the whole
#   instance runs with). The root user exists only to create them.
#   MONGO_ROOT_PASSWORD is read only on the first start of an empty volume; the
#   app and backup passwords are re-applied on every `up`. The replica set
#   member is named after the container, never localhost.
# - `backup` (profile `backup`, opt-in: deploy.ts --backup) dumps the
#   whole Mongo instance, with its oplog (one consistent moment), every night to the backup-data volume, copies the dump and a mirror
#   of the media bucket to an offsite S3 bucket, and mails BACKUP_ALERT_TO on
#   failure. deploy/restore.ts and deploy/restore-drill.ts run inside it.
# - MinIO is pinned by digest to Chainguard's build, as docker-compose.yml is.

name: ${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix

networks:
  # The stack's own network: every service is on it, nothing outside the stack.
  internal: {}
  # Traefik's network, shared with the parc's other stacks: `api` and `ui` only.
  proxy:
    external: true

volumes:
  mongo-data:
  redis-data:
  minio-data:
  backup-data:

x-common: &common
  restart: unless-stopped
  networks:
    - internal

x-oneshot: &oneshot
  restart: "no"
  networks:
    - internal

# What Traefik routes to: also on the shared `proxy` network.
x-routed: &routed
  networks:
    - internal
    - proxy

x-api-env: &api-env
  NODE_ENV: production
  UI_ORIGIN: ${PUBLIC_SCHEME:-https}://${UI_HOSTNAME:?}
  MAIL_FROM: ${MAIL_FROM:?}
  MAIL_URL: ${MAIL_URL:?}
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-redis:6379
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
  API_PROXY_SECRET: ${API_PROXY_SECRET:?}
  TOTP_KEYS: ${TOTP_KEYS:?}
  PULSARIX_MAGIC_LINK: ${PULSARIX_MAGIC_LINK:-false}
  MONGO_AUTO_SYNC: "true"
  MONGO_CORE_DATABASE: ${MONGO_CORE_DATABASE:-pulsarix_core}
  MONGO_ORGANISATION_PREFIX: ${MONGO_ORGANISATION_PREFIX:-pulsarix_org_}
  S3_ENDPOINT: http://${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-pulsarix-media}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?}

services:
  # ── data ────────────────────────────────────────────────────────────────────
  mongo:
    <<: *common
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    image: mongo:8.0
    container_name: ${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-mongo
    # mongod runs as PID 1 and never reaped the healthcheck's mongosh processes
    # (the check is a bash TCP probe now): tini (init) still reaps stray children.
    init: true
    # Auth on a replica set needs a keyfile. It is written from MONGO_KEYFILE at
    # each start (mongod insists on mode 400 and its own owner), so nothing
    # secret lives in the image or the repository. On the first start the
    # image's entrypoint creates the root user from MONGO_INITDB_ROOT_*.
    entrypoint:
      - bash
      - -c
      - |
        printf '%s' "$$MONGO_KEYFILE" > /tmp/mongo-keyfile
        chmod 400 /tmp/mongo-keyfile
        chown mongodb:mongodb /tmp/mongo-keyfile
        exec docker-entrypoint.sh "$$@"
      - --
    command:
      [
        "mongod",
        "--replSet",
        "rs0",
        "--bind_ip_all",
        "--keyFile",
        "/tmp/mongo-keyfile",
      ]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?}
      MONGO_KEYFILE: ${MONGO_KEYFILE:?}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # A TCP probe from bash (the image has no nc, wget or curl): no mongosh per
      # check, which cost ~1 s of CPU each run and left zombies. The replica set
      # is initiated and awaited by mongo-init, not by this check.
      test:
        - CMD
        - bash
        - -c
        - "echo > /dev/tcp/127.0.0.1/27017"
      # Every 2 s while starting, so the stack still comes up fast, then 30 s.
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    labels:
      - traefik.enable=false

  mongo-init:
    <<: *oneshot
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    image: mongo:8.0
    container_name: ${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # The member's name in the replica set: the container name, which every
      # other container resolves. `localhost` would make drivers outside this
      # container connect to themselves.
      MONGO_RS_HOST: ${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-mongo
      DIRECT_URI: mongodb://root:${MONGO_ROOT_PASSWORD:?}@${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-mongo:27017/admin?directConnection=true
      ROOT_URI: mongodb://root:${MONGO_ROOT_PASSWORD:?}@${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-mongo:27017/admin?replicaSet=rs0
      APP_USER: ${MONGO_APP_USER:-px_app}
      APP_PASSWORD: ${MONGO_APP_PASSWORD:?}
      BACKUP_USER: ${MONGO_BACKUP_USER:-px_backup}
      # Optional: only the `backup` profile needs the backup user. Empty, none is
      # created (an existing one is left as it is).
      BACKUP_PASSWORD: ${MONGO_BACKUP_PASSWORD:-}
    # Idempotent: a user that exists gets its password and roles set again, so a
    # rotated secret in .env is applied by `up`.
    command:
      - sh
      - -c
      - |
        mongosh --nodb --quiet --eval '
          // Initiates the replica set (once) and waits for its primary; the
          // mongo healthcheck only probes the port. Retried: the first start
          // runs a temporary mongod before the real one and the root user.
          let ready = false;
          let last = "";
          for (let i = 0; i < 120 && !ready; i++) {
            try {
              const direct = new Mongo(process.env.DIRECT_URI).getDB("admin");
              try {
                direct.adminCommand({ replSetGetStatus: 1 });
              } catch (e) {
                direct.adminCommand({
                  replSetInitiate: { _id: "rs0", members: [{ _id: 0, host: process.env.MONGO_RS_HOST + ":27017" }] },
                });
              }
              ready = direct.adminCommand({ hello: 1 }).isWritablePrimary === true;
            } catch (e) { last = String(e); }
            if (!ready) sleep(1000);
          }
          if (!ready) throw new Error("no replica set primary after 120 s: " + last);
          const admin = new Mongo(process.env.ROOT_URI).getDB("admin");
          const upsert = (user, pwd, roles) =>
            admin.getUser(user) ? admin.updateUser(user, { pwd, roles }) : admin.createUser({ user, pwd, roles });
          upsert(process.env.APP_USER, process.env.APP_PASSWORD, [{ role: "readWriteAnyDatabase", db: "admin" }, { role: "dbAdminAnyDatabase", db: "admin" }]);
          if (process.env.BACKUP_PASSWORD)
            upsert(process.env.BACKUP_USER, process.env.BACKUP_PASSWORD, [{ role: "backup", db: "admin" }]);
          print("users ready");
        '
    labels:
      - traefik.enable=false

  redis:
    <<: *common
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    image: redis:7.4
    container_name: ${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-redis
    # The password goes into a config file written at each start, so it is in
    # no argument list (docker inspect, ps). The entrypoint is the image's, which
    # drops to the redis user for `redis-server`.
    entrypoint:
      - bash
      - -c
      - |
        printf 'requirepass %s\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        chmod 400 /tmp/redis.conf
        chown redis:redis /tmp/redis.conf
        exec docker-entrypoint.sh "$$@"
      - --
    command: ["redis-server", "/tmp/redis.conf", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
      start_interval: 2s
    labels:
      - traefik.enable=false

  minio:
    <<: *common
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    image: cgr.dev/chainguard/minio@sha256:268d68a2a3b6fc65f905a61f84d7eab6345ce6bff14f551e2b028ec31e6a1341
    container_name: ${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-minio
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      MINIO_BROWSER: "off"
    volumes:
      - minio-data:/data
    healthcheck:
      # No curl in the image: bash opens the socket itself.
      test:
        - CMD
        - bash
        - -c
        - |-
          exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && read -r line <&3 && [[ $$line == *' 200 '* ]]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    labels:
      # Never public: the API streams the images (S3_ENDPOINT stays private).
      - traefik.enable=false

  # One-shot, idempotent: creates the private bucket, a policy limited to it
  # and the user the API runs with (S3_ACCESS_KEY / S3_SECRET_KEY), then exits.
  # The minio-client image has no shell, so `mc` is copied into a Wolfi base
  # that has one.
  minio-init:
    <<: *oneshot
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    image: ${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-minio-init:${TAG:-local}
    build:
      dockerfile_inline: |
        FROM cgr.dev/chainguard/minio-client@sha256:59f1924e417b6fcfdc0aca321e3bdebe8a56fd0efa7da80037d5eb65a203d687 AS mc
        FROM cgr.dev/chainguard/wolfi-base@sha256:88a20e2d017bd20cdc0cb3910de603e7bea9512a6c351a8dd3c9df212ab03d73
        COPY --from=mc /usr/bin/mc /usr/local/bin/mc
    container_name: ${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:?}:${MINIO_ROOT_PASSWORD:?}@${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-minio:9000
      BUCKET: ${S3_BUCKET:-pulsarix-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
    command:
      - sh
      - -ec
      - |
        mc mb --ignore-existing "local/$$BUCKET"
        cat > /tmp/policy.json <<POLICY
        {"Version":"2012-10-17","Statement":[{"Effect":"Allow",
          "Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:ListBucket","s3:GetBucketLocation"],
          "Resource":["arn:aws:s3:::$$BUCKET","arn:aws:s3:::$$BUCKET/*"]}]}
        POLICY
        mc admin policy create local pulsarix-media /tmp/policy.json
        mc admin user add local "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        # Only an "already applied" answer (XMinioAdminPolicyChangeAlreadyApplied) is tolerated; any other failure fails the job.
        out=$$(mc admin policy attach local pulsarix-media --user "$$S3_ACCESS_KEY" 2>&1) || {
          case "$$out" in
            *[Aa]lready*) echo "policy already attached" ;;
            *) echo "$$out" >&2; exit 1 ;;
          esac
        }
        echo "minio ready"
    labels:
      - traefik.enable=false

  # ── backups ─────────────────────────────────────────────────────────────────
  # Built from ./backup: the mongo image (mongodump, mongorestore) plus mc and
  # curl. It holds the backup user's credential (the `backup` role: reads the whole
  # instance and its oplog, writes nothing), which the full-instance
  # `mongodump --oplog` needs; restore.ts brings the root one in per run, never
  # stored here.
  backup:
    <<: *common
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    # Opt-in: `docker compose --profile backup up` (deploy.ts --backup). Without
    # the profile the service is neither built nor started.
    profiles: [backup]
    image: ${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-backup:${TAG:-local}
    build:
      context: ./backup
    container_name: ${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-backup
    # A real init as PID 1 reaps the children and passes `docker stop`'s TERM to
    # backup-loop, which forwards it to a running backup.
    init: true
    # Time for the stopped run to wait for its child, clean up and mail the
    # failure alert (curl up to 60 s) before docker kills the container.
    stop_grace_period: 90s
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      MONGO_URI: mongodb://${MONGO_BACKUP_USER:-px_backup}:${MONGO_BACKUP_PASSWORD:-}@${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-mongo:27017/?replicaSet=rs0&authSource=admin
      MONGO_CORE_DATABASE: ${MONGO_CORE_DATABASE:-pulsarix_core}
      MONGO_ORGANISATION_PREFIX: ${MONGO_ORGANISATION_PREFIX:-pulsarix_org_}
      S3_ENDPOINT: http://${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-minio:9000
      S3_BUCKET: ${S3_BUCKET:-pulsarix-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      # The offsite target: any S3-compatible endpoint (MinIO, B2, Wasabi, S3).
      # Compose interpolates every service, profile or not, so these cannot be
      # `${X:?}` without breaking a stack that leaves the backup out: they
      # default to empty and `deploy.ts --backup` refuses to go on without them
      # (backupProblems).
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      # Per stack by default, so two stacks never share a prefix.
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-pulsarix${STACK_PREFIX:+-${STACK_PREFIX}}}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-03}
      # Mailed (through MAIL_URL, as the API) when a run fails, or when the last
      # success is older than 26 h. Empty: no mail, the healthcheck still shows it.
      BACKUP_ALERT_TO: ${BACKUP_ALERT_TO:-}
      MAIL_FROM: ${MAIL_FROM:?}
      MAIL_URL: ${MAIL_URL:?}
    volumes:
      - backup-data:/backups
    healthcheck:
      # Unhealthy when the last good backup is older than 26 h (a run failed or
      # was missed). A new volume is seeded at boot, healthy until the first run.
      test:
        - CMD-SHELL
        - "[ $$(( $$(date -u +%s) - $$(cat /backups/last-success) )) -lt 93600 ]"
      interval: 5m
      # Probes every 5 s during start_period, so `up --wait` does not wait a
      # whole interval for the first answer. Needs Docker Engine 25+.
      start_interval: 5s
      timeout: 10s
      retries: 1
      start_period: 30s
    labels:
      - traefik.enable=false

  # ── the API ─────────────────────────────────────────────────────────────────
  api:
    <<: [*routed, *common]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    image: ${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-api:${TAG:-local}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: ${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-api
    # bun spawns children (and runc leaves its own): tini (init) reaps them, else
    # they pile up as zombies.
    init: true
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *api-env
      MONGO_URI: mongodb://${MONGO_APP_USER:-px_app}:${MONGO_APP_PASSWORD:?}@${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-mongo:27017/?replicaSet=rs0&authSource=admin
      PORT: "3000"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - |-
          exec 3<>/dev/tcp/127.0.0.1/3000 && printf 'GET /ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && read -r line <&3 && [[ $$line == *' 200 '* ]]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    labels:
      - traefik.enable=true
      # Only the public intake endpoint is routed (priority above the UI's
      # catch-all); /graphql is reached by the UI's server, by container name.
      - traefik.http.routers.${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-api.rule=Host(`${UI_HOSTNAME:?}`) && PathPrefix(`/public/`)
      - traefik.http.routers.${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-api.priority=100
      - traefik.http.routers.${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-api.entrypoints=${TRAEFIK_HTTP_ENTRYPOINTS:-websecure}
      - traefik.http.routers.${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-api.tls=${TRAEFIK_USE_TLS:-true}
      - traefik.http.routers.${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-api.service=${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-api
      - traefik.http.services.${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-api.loadbalancer.server.port=3000

  # ── the UI (profile `ui`, started with `--ui`) ───────────────────────────────
  ui:
    <<: [*routed, *common]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    profiles: [ui]
    image: ${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-ui:${TAG:-local}
    build:
      context: ${UI_CONTEXT:-../../pulsarix-ui}
      dockerfile: Dockerfile
    container_name: ${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-ui
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      PULSARIX_API_URL: http://${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-api:3000/graphql
      APP_ORIGIN: ${PUBLIC_SCHEME:-https}://${UI_HOSTNAME:?}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      # Sent to the API as x-pulsarix-proxy-secret; the UI refuses to start in
      # production without it (32 characters or more), and the API honours the
      # forwarded client address only on a request that carries it.
      API_PROXY_SECRET: ${API_PROXY_SECRET:?}
      # The widget's `dist`, which the UI serves at /widget/v1/*. Without it
      # the route answers 404 in production.
      WIDGET_DIST_DIR: /widget
    volumes:
      # pulsarix-widget's built `dist` (`bun run build` there), read only, from
      # WIDGET_DIST (default: the sibling checkout). A missing folder fails
      # `up` instead of being created empty.
      - type: bind
        source: ${WIDGET_DIST:-../../pulsarix-widget/dist}
        target: /widget
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    labels:
      - traefik.enable=true
      - traefik.http.routers.${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-ui.rule=Host(`${UI_HOSTNAME:?}`)
      - traefik.http.routers.${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-ui.entrypoints=${TRAEFIK_HTTP_ENTRYPOINTS:-websecure}
      - traefik.http.routers.${STACK_PREFIX:+${STACK_PREFIX}-}pulsarix-ui.tls=${TRAEFIK_USE_TLS:-true}
